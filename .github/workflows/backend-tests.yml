name: Backend unit tests

on:
  push:
    branches:
      - feature/test-get-goals-for-user
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore test dependencies
        run: dotnet restore ./CommBank.Tests/CommBank.Tests.csproj

      - name: Run backend unit tests
        run: dotnet test ./CommBank.Tests/CommBank.Tests.csproj --no-restore --logger "console;verbosity=normal"
